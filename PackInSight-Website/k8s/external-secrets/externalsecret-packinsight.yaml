apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: packinsight-app-secrets
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: packinsight-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: TURSO_CONNECTION_URL
      remoteRef:
        key: packinsight/prod/app
        property: TURSO_CONNECTION_URL
    - secretKey: TURSO_AUTH_TOKEN
      remoteRef:
        key: packinsight/prod/app
        property: TURSO_AUTH_TOKEN
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: packinsight/prod/app
        property: BETTER_AUTH_SECRET
    - secretKey: BETTER_AUTH_URL
      remoteRef:
        key: packinsight/prod/app
        property: BETTER_AUTH_URL
    - secretKey: NEXT_PUBLIC_SITE_URL
      remoteRef:
        key: packinsight/prod/app
        property: NEXT_PUBLIC_SITE_URL
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: packinsight/prod/app
        property: OPENAI_API_KEY
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: packinsight/prod/app
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: packinsight/prod/app
        property: GOOGLE_CLIENT_SECRET
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: packinsight/prod/app
        property: GITHUB_CLIENT_ID
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: packinsight/prod/app
        property: GITHUB_CLIENT_SECRET
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: packinsight/prod/app
        property: GITHUB_TOKEN
