name: CI - Build and Push to ECR

on:
  push:
    branches:
      - devops

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: nextjs-prod-repo
  IMAGE_TAG: ${{ github.sha }}
  HELM_VALUES_FILE: helm/nextjs-app/values.yaml  

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::721094929349:role/github-actions-nextjs-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push Docker image
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Helm image tag
        run: |
          sed -i "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" $HELM_VALUES_FILE
          echo "Updated image tag in $HELM_VALUES_FILE to $IMAGE_TAG"

      - name: Commit and push updated Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $HELM_VALUES_FILE
          git commit -m "Update image tag to ${IMAGE_TAG} [skip ci]" || echo "No changes to commit"
          git push
